name: Build and Test

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
env:
  BENGINE_TEMPLATE_CACHE: ${{ github.workspace }}/export-template-cache

jobs:
  build_and_test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Set up CMake (Linux)
      uses: jwlawson/actions-setup-cmake@v1
      if: runner.os == 'Linux'

    - name: Install dependencies (Linux)
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake build-essential xvfb xauth pkg-config xorg-dev libglu1-mesa-dev \
          liblua5.3-0 liblua5.3-dev libglm-dev libglfw3-dev \
          libassimp-dev libfreeimage-dev rapidjson-dev \
          libbullet-dev libfreetype6-dev libpng-dev libjpeg-dev libcurl4-openssl-dev zlib1g-dev
      if: runner.os == 'Linux'

    - name: Check out supported Windows dependencies
      if: runner.os == 'Windows'
      uses: actions/checkout@v4
      with:
        repository: microsoft/vcpkg
        ref: 2026.10.16
        path: .vcpkg
    - name: Prepare supported vcpkg
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        & "$PWD/.vcpkg/bootstrap-vcpkg.bat" -disableMetrics
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        "VCPKG_INSTALLATION_ROOT=$PWD/.vcpkg" >> $env:GITHUB_ENV
    - name: Install dependencies (Windows)
      shell: pwsh
      run: |
        & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install "--overlay-ports=$PWD/cmake/vcpkg-ports" `
          assimp:x64-windows bullet3:x64-windows freetype:x64-windows `
          glfw3:x64-windows glm:x64-windows lua:x64-windows curl:x64-windows zlib:x64-windows
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      if: runner.os == 'Windows'

    - name: Build and test (Linux)
      run: bash scripts/build.sh out --test
      if: runner.os == 'Linux'

    - name: Build and test (Windows)
      shell: pwsh
      run: |
        $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
        ./scripts/build.ps1 -BuildDirectory out -RunTests
      if: runner.os == 'Windows'

    - name: Exercise editor runtime with the real demo (Linux)
      if: runner.os == 'Linux'
      run: xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 BENGINE_RUNTIME_SMOKE=1 ctest --test-dir out --output-on-failure

    - name: Export Linux game and single executable
      if: runner.os == 'Linux'
      run: |
        sh scripts/platform_build.sh linux "$PWD" "$PWD/game-build" "$PWD/game-build.progress" "$PWD/projects/fpp_demo/project.bengine" "$PWD/game-work" folder "" "$PWD/out/apps/game_packager"
        sh scripts/platform_build.sh linux "$PWD" "$PWD/game-single" "$PWD/game-single.progress" "$PWD/projects/fpp_demo/project.bengine" "$PWD/game-single-work" single "" "$PWD/out/apps/game_packager"

    - name: Export native Windows game without WSL
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
        ./scripts/platform_build.ps1 -Target windows -RepositoryRoot "$PWD" -BuildDirectory "$PWD/game-build" -ProgressFile "$PWD/game-build.progress" -ProjectFile "$PWD/projects/fpp_demo/project.bengine" -Packager "$PWD/out/apps/Release/game_packager.exe"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        if (-not (Test-Path game-build/windows/fpp_demo.exe)) { throw "Game executable missing" }

    - name: Upload native Windows game package
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: windows-game-native
        path: game-build/windows
        if-no-files-found: error

    - name: Upload precompiled runtime templates
      uses: actions/upload-artifact@v4
      with:
        name: export-templates-${{ matrix.os }}
        path: export-template-cache
        if-no-files-found: error

    - name: Upload executables
      uses: actions/upload-artifact@v4
      with:
        name: bubble-engine-${{ matrix.os }}
        path: |
          out/apps/editor_app
          out/apps/runtime_app
          out/apps/game_packager
          out/apps/Release/editor_app.exe
          out/apps/Release/runtime_app.exe
          out/apps/Release/game_packager.exe
        if-no-files-found: error

  cross_windows:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive
    - name: Install cross-build host tools
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential curl git pkg-config zip unzip ninja-build binutils-mingw-w64-x86-64 zlib1g-dev
    - name: Export Windows game on Linux
      run: |
        mkdir -p game-build
        sh scripts/platform_build.sh windows "$PWD" "$PWD/game-build" "$PWD/game-build.progress" "$PWD/projects/fpp_demo/project.bengine"
        file game-build/windows/fpp_demo.exe | grep 'PE32+'
    - uses: actions/upload-artifact@v4
      with:
        name: export-templates-windows-from-linux
        path: export-template-cache
        if-no-files-found: error
    - uses: actions/upload-artifact@v4
      with:
        name: windows-game-from-linux
        path: game-build/windows
        if-no-files-found: error
