name: Release Bubble Engine

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate tag against CMake
        run: python3 tools/release/package.py --version "$GITHUB_REF_NAME" --validate-only

  package:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential xvfb xauth python3-tk liblua5.3-dev libglm-dev libglfw3-dev libassimp-dev libbullet-dev libfreetype6-dev libpng-dev libjpeg-dev zlib1g-dev libcurl4-openssl-dev
      - name: Check out supported Windows dependencies
        if: runner.os == 'Windows'
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: 2026.10.16
          path: .vcpkg
      - name: Prepare supported vcpkg
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$PWD/.vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "VCPKG_INSTALLATION_ROOT=$PWD/.vcpkg" >> $env:GITHUB_ENV
          $env:VCPKG_DEFAULT_BINARY_CACHE = "$PWD/.vcpkg-cache"
          "VCPKG_DEFAULT_BINARY_CACHE=$env:VCPKG_DEFAULT_BINARY_CACHE" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
      - name: Restore Windows dependency cache
        if: runner.os == 'Windows'
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-windows-2022-2026.10.16-${{ hashFiles('cmake/vcpkg-ports/**') }}
      - name: Install Windows build dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install "--overlay-ports=$PWD/cmake/vcpkg-ports" assimp:x64-windows bullet3:x64-windows freetype:x64-windows glfw3:x64-windows glm:x64-windows lua:x64-windows zlib:x64-windows curl:x64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Save Windows dependency cache
        if: runner.os == 'Windows' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .vcpkg-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Configure Linux release
        if: runner.os == 'Linux'
        run: cmake -S . -B out -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DBUILD_EDITOR=ON -DBUILD_RUNTIME=ON -DBENGINE_BUILD_BENCHMARKS=ON
      - name: Configure Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B out -DBUILD_TESTING=ON -DBUILD_EDITOR=ON -DBUILD_RUNTIME=ON "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build
        run: cmake --build out --config Release --parallel 2
      - name: Test
        run: ctest --test-dir out --output-on-failure -C Release
      - name: Exercise editor runtime with the real demo
        if: runner.os == 'Linux'
        run: xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 BENGINE_RUNTIME_SMOKE=1 ctest --test-dir out --output-on-failure
      - name: Generate release performance reports
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p out/benchmark-baseline release
          baseline=()
          if gh release download --repo "$GITHUB_REPOSITORY" --pattern benchmark-Linux.json --dir out/benchmark-baseline; then
            baseline=(--baseline out/benchmark-baseline/benchmark-Linux.json)
          else
            echo "No previous benchmark available; recording the first baseline."
          fi
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 python3 tools/benchmarks/run.py \
            --executable out/tools/benchmarks/bengine_ui_benchmark \
            --output out/benchmark-reports --release "$GITHUB_REF_NAME" --label Linux "${baseline[@]}"
          cp out/benchmark-reports/benchmark-Linux.json out/benchmark-reports/benchmark-Linux.md release/
          python3 -c 'import shutil; shutil.make_archive("release/benchmark-Linux-raw", "zip", "out/benchmark-reports")'
          cat out/benchmark-reports/benchmark-Linux.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve benchmark evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks-Linux
          path: out/benchmark-reports/
          if-no-files-found: warn
      - name: Configure relocatable Linux binaries
        if: runner.os == 'Linux'
        run: cmake -S . -B release-build -DCMAKE_BUILD_TYPE=Release -DBENGINE_DISTRIBUTION_BUILD=ON -DBUILD_TESTING=OFF -DBUILD_EDITOR=ON -DBUILD_RUNTIME=ON
      - name: Configure relocatable Windows binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B release-build -DBENGINE_DISTRIBUTION_BUILD=ON -DBUILD_TESTING=OFF -DBUILD_EDITOR=ON -DBUILD_RUNTIME=ON "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build relocatable binaries
        run: cmake --build release-build --config Release --parallel 2
      - name: Package Linux engine
        if: runner.os == 'Linux'
        run: python tools/release/package.py --build release-build --output release --version "$GITHUB_REF_NAME"
      - name: Package Windows engine
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python tools/release/package.py --build release-build --output release --version "$env:GITHUB_REF_NAME" --library-dir "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: engine-${{ runner.os }}
          path: release/*
          if-no-files-found: error

  publish_release:
    needs: package
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: engine-*
          path: release-artifacts
      - name: Publish packages and generated changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release
          find release-artifacts -type f ! -name SHA256SUMS -exec cp {} release/ \;
          (cd release && sha256sum *.zip > SHA256SUMS)
          gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$GITHUB_REF_NAME" --jq .body > release/CHANGELOG.md
          notes_path="docs/RELEASE_${GITHUB_REF_NAME}.md"
          if [ -f "$notes_path" ]; then
            printf '\n' >> release/CHANGELOG.md
            cat "$notes_path" >> release/CHANGELOG.md
          fi
          previous=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          printf '\n## Commits\n\n' >> release/CHANGELOG.md
          if [ -n "$previous" ]; then
            git log --format='- %s (%h)' "$previous..$GITHUB_REF_NAME" >> release/CHANGELOG.md
          else
            git log --format='- %s (%h)' "$GITHUB_REF_NAME" >> release/CHANGELOG.md
          fi
          gh release create "$GITHUB_REF_NAME" release/* --verify-tag --title "Bubble Engine $GITHUB_REF_NAME" --notes-file release/CHANGELOG.md
